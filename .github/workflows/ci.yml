name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Run the real programs end to end
        run: ./scripts/smoke.sh
      - name: Set up two people the short way
        run: ./scripts/setup-smoke.sh
      - name: Reach a signed agreement end to end
        run: ./scripts/contract-smoke.sh
      - name: Lose a message and recover it by resend
        run: ./scripts/resend-smoke.sh
      - name: Exchange evidence about a repository end to end
        run: ./scripts/evidence-smoke.sh
